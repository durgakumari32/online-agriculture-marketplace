<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - AgroMarket</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar" id="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo"><i class="fas fa-seedling"></i> AgroMarket</a>
        <button class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="products.html" class="active"><i class="fas fa-store"></i> Products</a></li>
            <li><a href="about.html"><i class="fas fa-info-circle"></i> About</a></li>
            <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
            <li id="cartNav"><a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart <span class="cart-badge" id="cartBadge">0</span></a></li>
            <li id="dashboardNav" class="hidden"><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li id="authButtons">
                <a href="login.html" class="btn btn-outline">Login</a>
                <a href="register.html" class="btn btn-primary">Register</a>
            </li>
            <li id="userMenu" class="hidden">
                <span class="user-info"><i class="fas fa-user-circle"></i> <span id="userName"></span></span>
                <button onclick="logout()" class="btn btn-danger">Logout</button>
            </li>
        </ul>
    </div>
</nav>

<!-- ===== PAGE HEADER ===== -->
<div class="page-header">
    <div class="container">
        <h1><i class="fas fa-store"></i> Fresh Products</h1>
        <p>Browse all available agricultural products from verified farmers</p>
    </div>
</div>

<!-- ===== FILTERS BAR ===== -->
<div class="filters-bar">
    <div class="container">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search products..." oninput="filterProducts()" />
        </div>
        <div class="category-filters" id="categoryFilters">
            <button class="filter-btn active" data-cat="all" onclick="filterByCategory('all', this)">All</button>
            <button class="filter-btn" data-cat="Fruits" onclick="filterByCategory('Fruits', this)">🍎 Fruits</button>
            <button class="filter-btn" data-cat="Vegetables" onclick="filterByCategory('Vegetables', this)">🥦 Vegetables</button>
            <button class="filter-btn" data-cat="Grains" onclick="filterByCategory('Grains', this)">🌾 Grains</button>
            <button class="filter-btn" data-cat="Pulses" onclick="filterByCategory('Pulses', this)">🫘 Pulses</button>
            <button class="filter-btn" data-cat="Seeds" onclick="filterByCategory('Seeds', this)">🌱 Seeds</button>
            <button class="filter-btn" data-cat="Spices" onclick="filterByCategory('Spices', this)">🌶️ Spices</button>
            <button class="filter-btn" data-cat="Dairy Products" onclick="filterByCategory('Dairy Products', this)">🥛 Dairy</button>
            <button class="filter-btn" data-cat="Organic Products" onclick="filterByCategory('Organic Products', this)">🌿 Organic</button>
            <button class="filter-btn" data-cat="Fertilizers" onclick="filterByCategory('Fertilizers', this)">🪣 Fertilizers</button>
        </div>
        <div class="sort-box">
            <select id="sortSelect" onchange="sortProducts()" class="form-control">
                <option value="newest">Newest First</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="name">Name A-Z</option>
            </select>
        </div>
    </div>
</div>

<!-- ===== PRODUCTS SECTION ===== -->
<section class="products-page section">
    <div class="container">
        <div class="results-info">
            <span id="resultsCount">Loading...</span>
        </div>
        <div class="products-grid" id="productsGrid">
            <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading products...</div>
        </div>
    </div>
</section>

<!-- ===== PRODUCT DETAIL MODAL ===== -->
<div class="modal-overlay" id="productModal">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
        <div id="modalContent"></div>
    </div>
</div>

<!-- ===== FOOTER ===== -->
<footer class="footer">
    <div class="container">
        <div class="footer-bottom">
            <p>&copy; 2024 AgroMarket. All rights reserved.</p>
        </div>
    </div>
</footer>

<div class="toast-container" id="toastContainer"></div>

<script src="js/main.js"></script>
<script>
    let allProducts = [];
    let currentCategory = 'all';

    // Load URL params
    const urlParams = new URLSearchParams(window.location.search);
    const initCategory = urlParams.get('category');
    if (initCategory) {
        currentCategory = initCategory;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.cat === initCategory);
        });
    }

    async function loadProducts() {
        try {
            const response = await fetch('/api/products');
            const data = await response.json();
            if (data.success && Array.isArray(data.products) && data.products.length > 0) {
                allProducts = data.products;
            } else if (typeof DEFAULT_PRODUCTS !== 'undefined' && DEFAULT_PRODUCTS.length > 0) {
                allProducts = [...DEFAULT_PRODUCTS];
            } else {
                allProducts = [];
            }
        } catch (err) {
            if (typeof DEFAULT_PRODUCTS !== 'undefined') {
                allProducts = [...DEFAULT_PRODUCTS];
            } else {
                allProducts = [];
            }
        }
        renderProducts();
    }

    function renderProducts() {
        const search  = document.getElementById('searchInput').value.toLowerCase();
        const sort    = document.getElementById('sortSelect').value;
        let filtered  = allProducts.filter(p => {
            const matchCat = currentCategory === 'all' || p.category === currentCategory;
            const matchSearch = !search ||
                p.product_name.toLowerCase().includes(search) ||
                p.category.toLowerCase().includes(search) ||
                (p.description || '').toLowerCase().includes(search) ||
                (p.farmer_name || '').toLowerCase().includes(search);
            return matchCat && matchSearch;
        });

        // Sort
        if (sort === 'price-low') filtered.sort((a,b) => a.price - b.price);
        else if (sort === 'price-high') filtered.sort((a,b) => b.price - a.price);
        else if (sort === 'name') filtered.sort((a,b) => a.product_name.localeCompare(b.product_name));

        document.getElementById('resultsCount').textContent =
            `Showing ${filtered.length} product${filtered.length !== 1 ? 's' : ''}`;

        const grid = document.getElementById('productsGrid');
        if (filtered.length === 0) {
            grid.innerHTML = `<div class="no-products">
                <i class="fas fa-search"></i>
                <p>No products found. Try a different search or category.</p>
            </div>`;
        } else {
            grid.innerHTML = filtered.map(p => createProductCard(p, true)).join('');
        }
    }

    function filterProducts() { renderProducts(); }
    function sortProducts()   { renderProducts(); }

    function filterByCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProducts();
    }

    function viewProduct(id) {
        const p = allProducts.find(x => x.product_id === id);
        if (!p) return;
        const imgSrc = (typeof getProductImage === 'function') ? getProductImage(p) : (p.image_url || '');
        document.getElementById('modalContent').innerHTML = `
            <div class="product-detail">
                <div class="product-detail-img">
                    <img src="${imgSrc}" alt="${p.product_name}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=600&auto=format&fit=crop&q=80';" />
                </div>
                <div class="product-detail-info">
                    <span class="product-category-badge">${p.category}</span>
                    <h2>${p.product_name}</h2>
                    <div class="product-price-lg">₹${parseFloat(p.price).toFixed(2)} <span>/ unit</span></div>
                    <p class="product-desc">${p.description || 'No description available.'}</p>
                    <div class="product-meta">
                        <div><i class="fas fa-boxes"></i> <strong>Available:</strong> ${p.quantity} units</div>
                        <div><i class="fas fa-user-tie"></i> <strong>Farmer:</strong> ${p.farmer_name}</div>
                        <div><i class="fas fa-phone"></i> <strong>Contact:</strong> ${p.farmer_phone || 'N/A'}</div>
                    </div>
                    <div class="qty-selector">
                        <label>Quantity:</label>
                        <div class="qty-controls">
                            <button onclick="adjustModalQty(-1)"><i class="fas fa-minus"></i></button>
                            <input type="number" id="modalQty" value="1" min="1" max="${p.quantity}" />
                            <button onclick="adjustModalQty(1, ${p.quantity})"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                    <button onclick="addToCartModal(${p.product_id})" class="btn btn-primary btn-block">
                        <i class="fas fa-cart-plus"></i> Add to Cart
                    </button>
                </div>
            </div>
        `;
        document.getElementById('productModal').classList.add('active');
    }

    function adjustModalQty(delta, max) {
        const input = document.getElementById('modalQty');
        let val = parseInt(input.value) + delta;
        val = Math.max(1, Math.min(max || 999, val));
        input.value = val;
    }

    function addToCartModal(productId) {
        const qty = parseInt(document.getElementById('modalQty').value) || 1;
        addToCartById(productId, qty);
        closeModal();
    }

    function closeModal() {
        document.getElementById('productModal').classList.remove('active');
    }

    // Close on overlay click
    document.getElementById('productModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    checkAuth();
    updateCartBadge();
    loadProducts();
</script>
</body>
</html>
