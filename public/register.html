<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - AgroMarket</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="auth-page">

<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo"><i class="fas fa-seedling"></i> AgroMarket</a>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
            <h2>Create Account</h2>
            <p>Join AgroMarket - Connect &amp; Grow!</p>
        </div>

        <!-- Role Selection -->
        <div class="role-selector">
            <button type="button" class="role-btn active" id="roleCustomer" onclick="setRole('Customer')">
                <i class="fas fa-shopping-bag"></i>
                <span>Customer</span>
                <small>Buy fresh products</small>
            </button>
            <button type="button" class="role-btn" id="roleFarmer" onclick="setRole('Farmer')">
                <i class="fas fa-tractor"></i>
                <span>Farmer</span>
                <small>Sell your products</small>
            </button>
        </div>

        <div id="messageBox" class="message-box hidden"></div>

        <form id="registerForm" class="auth-form">
            <input type="hidden" id="role" value="Customer" />

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="name" placeholder="Enter full name" required class="form-control" minlength="2" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone</label>
                    <input type="tel" id="phone" placeholder="10-digit phone number" class="form-control" pattern="[0-9]{10}" />
                </div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required class="form-control" />
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Minimum 6 characters" required class="form-control" minlength="6" />
                    <button type="button" class="toggle-pass" onclick="togglePassword('password', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Confirm Password</label>
                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required class="form-control" minlength="6" />
                    <button type="button" class="toggle-pass" onclick="togglePassword('confirmPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Password strength indicator -->
            <div class="password-strength" id="strengthBar">
                <div class="strength-fill" id="strengthFill"></div>
            </div>
            <span class="strength-label" id="strengthLabel"></span>

            <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>
        <div class="auth-footer">
            <p>Already have an account? <a href="login.html">Login Here</a></p>
        </div>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    function setRole(role) {
        document.getElementById('role').value = role;
        document.getElementById('roleCustomer').classList.toggle('active', role === 'Customer');
        document.getElementById('roleFarmer').classList.toggle('active', role === 'Farmer');
    }

    // Password strength
    document.getElementById('password').addEventListener('input', function() {
        const val = this.value;
        const fill = document.getElementById('strengthFill');
        const label = document.getElementById('strengthLabel');
        let strength = 0;
        if (val.length >= 6) strength++;
        if (val.match(/[A-Z]/)) strength++;
        if (val.match(/[0-9]/)) strength++;
        if (val.match(/[^A-Za-z0-9]/)) strength++;

        const levels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
        const colors = ['', '#e74c3c', '#f39c12', '#3498db', '#27ae60'];
        fill.style.width = (strength * 25) + '%';
        fill.style.background = colors[strength];
        label.textContent = val.length > 0 ? levels[strength] : '';
        label.style.color = colors[strength];
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('registerBtn');

        const password = document.getElementById('password').value;
        const confirm  = document.getElementById('confirmPassword').value;

        if (password !== confirm) {
            showMessage('messageBox', 'Passwords do not match.', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

        try {
            const response = await fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name:     document.getElementById('name').value.trim(),
                    email:    document.getElementById('email').value.trim(),
                    phone:    document.getElementById('phone').value.trim(),
                    password: password,
                    role:     document.getElementById('role').value
                })
            });
            const data = await response.json();

            if (data.success) {
                showMessage('messageBox', data.message, 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } else {
                showMessage('messageBox', data.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        } catch (err) {
            showMessage('messageBox', 'Connection error. Please try again.', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
        }
    });
</script>
</body>
</html>
