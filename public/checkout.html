<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - AgroMarket</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo"><i class="fas fa-seedling"></i> AgroMarket</a>
        <ul class="nav-links" id="navLinks">
            <li><a href="cart.html"><i class="fas fa-arrow-left"></i> Back to Cart</a></li>
            <li id="userMenu" class="hidden">
                <span class="user-info"><i class="fas fa-user-circle"></i> <span id="userName"></span></span>
                <button onclick="logout()" class="btn btn-danger">Logout</button>
            </li>
        </ul>
    </div>
</nav>

<div class="page-header">
    <div class="container">
        <h1><i class="fas fa-credit-card"></i> Checkout</h1>
        <p>Complete your order</p>
    </div>
</div>

<!-- Steps bar -->
<div class="checkout-steps">
    <div class="step active"><span>1</span> Cart</div>
    <div class="step-line"></div>
    <div class="step active"><span>2</span> Checkout</div>
    <div class="step-line"></div>
    <div class="step"><span>3</span> Confirm</div>
</div>

<section class="checkout-page section">
    <div class="container">
        <div id="checkoutContent"></div>
    </div>
</section>

<!-- Success Modal -->
<div class="modal-overlay" id="successModal">
    <div class="modal-box success-modal">
        <div class="success-icon"><i class="fas fa-check-circle"></i></div>
        <h2>Order Placed Successfully!</h2>
        <p id="successOrderId"></p>
        <p>Your fresh products are on their way. Thank you for shopping with AgroMarket! 🌾</p>
        <div class="success-actions">
            <a href="dashboard.html" class="btn btn-primary">View My Orders</a>
            <a href="products.html" class="btn btn-outline">Continue Shopping</a>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/main.js"></script>
<script>
    async function initCheckout() {
        const user = await checkAuth();
        if (!user) {
            showToast('Please login to checkout.', 'error');
            setTimeout(() => window.location.href = 'login.html', 1500);
            return;
        }
        if (user.role === 'Farmer') {
            showToast('Farmers cannot place orders.', 'error');
            setTimeout(() => window.location.href = 'dashboard.html', 1500);
            return;
        }

        const cart = getCart();
        if (cart.length === 0) {
            window.location.href = 'cart.html';
            return;
        }

        const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        const delivery = subtotal > 500 ? 0 : 50;
        const total    = subtotal + delivery;

        document.getElementById('checkoutContent').innerHTML = `
            <div class="checkout-layout">
                <div class="checkout-form-section">
                    <div class="card">
                        <h3><i class="fas fa-map-marker-alt"></i> Delivery Address</h3>
                        <form id="checkoutForm">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Full Name *</label>
                                    <input type="text" id="fullName" class="form-control" value="${user.name}" required />
                                </div>
                                <div class="form-group">
                                    <label>Phone *</label>
                                    <input type="tel" id="phone" class="form-control" value="${user.phone || ''}" required />
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Street Address *</label>
                                <input type="text" id="street" class="form-control" placeholder="House No, Street Name" required />
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>City *</label>
                                    <input type="text" id="city" class="form-control" placeholder="City" required />
                                </div>
                                <div class="form-group">
                                    <label>State *</label>
                                    <input type="text" id="state" class="form-control" placeholder="State" required />
                                </div>
                                <div class="form-group">
                                    <label>Pincode *</label>
                                    <input type="text" id="pincode" class="form-control" placeholder="6-digit pincode" pattern="[0-9]{6}" required />
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="card mt-2">
                        <h3><i class="fas fa-credit-card"></i> Payment Method</h3>
                        <div class="payment-options">
                            <label class="payment-option active">
                                <input type="radio" name="payment" value="cod" checked />
                                <i class="fas fa-money-bill-wave"></i>
                                <span>Cash on Delivery</span>
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="payment" value="upi" />
                                <i class="fas fa-mobile-alt"></i>
                                <span>UPI Payment</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="checkout-summary-section">
                    <div class="cart-summary-card">
                        <h3><i class="fas fa-receipt"></i> Order Summary</h3>
                        ${cart.map(item => `
                            <div class="summary-item">
                                <span>${item.product_name} × ${item.qty}</span>
                                <span>₹${(item.price * item.qty).toFixed(2)}</span>
                            </div>
                        `).join('')}
                        <hr>
                        <div class="summary-row"><span>Subtotal</span><span>₹${subtotal.toFixed(2)}</span></div>
                        <div class="summary-row"><span>Delivery</span><span>${delivery === 0 ? '<span class="free-label">FREE</span>' : '₹' + delivery.toFixed(2)}</span></div>
                        <hr>
                        <div class="summary-row total-row"><span>Total</span><strong>₹${total.toFixed(2)}</strong></div>
                        <button onclick="placeOrder(${total})" class="btn btn-primary btn-block mt-2" id="placeOrderBtn">
                            <i class="fas fa-check-circle"></i> Place Order
                        </button>
                    </div>
                </div>
            </div>`;
    }

    async function placeOrder(totalAmount) {
        const btn = document.getElementById('placeOrderBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Placing Order...';

        const street  = document.getElementById('street').value.trim();
        const city    = document.getElementById('city').value.trim();
        const state   = document.getElementById('state').value.trim();
        const pincode = document.getElementById('pincode').value.trim();
        const name    = document.getElementById('fullName').value.trim();
        const phone   = document.getElementById('phone').value.trim();

        if (!street || !city || !state || !pincode || !name || !phone) {
            showToast('Please fill all address fields.', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check-circle"></i> Place Order';
            return;
        }

        const address = `${name}, ${phone}, ${street}, ${city}, ${state} - ${pincode}`;
        const cart = getCart();
        const items = cart.map(i => ({
            product_id: i.product_id,
            quantity: i.qty,
            price: i.price
        }));

        try {
            const response = await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items, delivery_address: address, total_amount: totalAmount })
            });
            const data = await response.json();
            if (data.success) {
                saveCart([]);
                document.getElementById('successOrderId').textContent = `Order #${data.orderId}`;
                document.getElementById('successModal').classList.add('active');
            } else {
                showToast(data.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Place Order';
            }
        } catch (err) {
            showToast('Error placing order. Please try again.', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check-circle"></i> Place Order';
        }
    }

    initCheckout();
</script>
</body>
</html>
